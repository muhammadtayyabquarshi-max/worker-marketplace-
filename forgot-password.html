<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password</title>
<link rel="stylesheet" href="app.css">
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.card{max-width:420px;margin:50px auto;background:white;padding:25px;border-radius:14px}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#087f5b;color:white;border:0;font-weight:bold}
</style>
</head>
<body>

<div class="card">
<h2>Forgot Password / پاس ورڈ بھول گئے؟</h2>

<p>اپنا رجسٹرڈ Email درج کریں۔</p>

<form id="resetForm">
<input type="email" id="email" placeholder="Enter your email" required>
<button type="submit" id="btn">Send Reset Link</button>
</form>

<p id="msg"></p>
<a href="login.html">Back to Login</a>
</div>

<script type="module">
import {auth} from "./firebase.js";

import {
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const form=document.getElementById("resetForm");
const msg=document.getElementById("msg");
const btn=document.getElementById("btn");

form.addEventListener("submit",async(e)=>{
e.preventDefault();

btn.disabled=true;
msg.textContent="Sending...";

try{
await sendPasswordResetEmail(
auth,
document.getElementById("email").value.trim()
);

msg.textContent="Reset link sent! Check your email.";

}catch(error){
msg.textContent=error.message;
}

btn.disabled=false;
});
</script>

</body>
</html>
