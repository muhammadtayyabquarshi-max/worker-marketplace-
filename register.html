<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration - Worker Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ddd;
}

h2 {
    text-align: center;
    color: #075e54;
}

input, select {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #075e54;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    margin-top: 12px;
}

.message {
    text-align: center;
    color: green;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h2>Worker Booking App</h2>

<h3>Create Your Account</h3>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label>Mobile Number</label>
<input type="tel" id="phone" placeholder="03XXXXXXXXX"
pattern="03[0-9]{9}" required>

<label>Select Account Type</label>

<select id="account" required>
<option value="">Choose Account</option>
<option value="Customer">Customer</option>
<option value="Worker">Worker</option>
</select>

<label>City</label>
<input type="text" id="city" placeholder="Enter your city" required>

<label>Password</label>
<input type="password" id="password"
placeholder="Create password" minlength="6" required>

<button type="submit">Create Account</button>

</form>

<p class="message" id="message"></p>

</div>

<script>

document.getElementById("registerForm")
.addEventListener("submit", function(event) {

event.preventDefault();

const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const account = document.getElementById("account").value;
const city = document.getElementById("city").value;

document.getElementById("message").innerText =
"Registration form completed! Welcome " + name;

});

</script>

</body>
</html>
