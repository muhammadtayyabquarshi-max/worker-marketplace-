<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Booking App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    color: #222;
}

header {
    background: #075e54;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    padding: 20px;
}

.language {
    text-align: right;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #075e54;
    color: white;
    font-size: 15px;
}

.welcome {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

h2 {
    color: #075e54;
}

.services {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.service {
    background: white;
    padding: 20px 10px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 2px 6px #ddd;
}

.service span {
    font-size: 30px;
}

.service h3 {
    font-size: 16px;
}

.book {
    width: 100%;
    margin-top: 10px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>Worker Booking</h1>
    <p id="subtitle">Find the right worker for your work</p>
</header>

<div class="container">

<div class="language">
    <button onclick="changeLanguage()" id="langBtn">
        اردو
    </button>
</div>

<div class="welcome">
    <h2 id="welcome">Welcome!</h2>
    <p id="description">
        Book trusted workers near you.
    </p>
</div>

<h2 id="servicesTitle">Choose a Service</h2>

<div class="services">

<div class="service">
    <span>⚡</span>
    <h3 id="electrician">Electrician</h3>
    <button class="book" onclick="book('Electrician')">Book Now</button>
</div>

<div class="service">
    <span>🔧</span>
    <h3 id="plumber">Plumber</h3>
    <button class="book" onclick="book('Plumber')">Book Now</button>
</div>

<div class="service">
    <span>🎨</span>
    <h3 id="painter">Painter</h3>
    <button class="book" onclick="book('Painter')">Book Now</button>
</div>

<div class="service">
    <span>🧹</span>
    <h3 id="cleaner">Cleaner</h3>
    <button class="book" onclick="book('Cleaner')">Book Now</button>
</div>

<div class="service">
    <span>🪚</span>
    <h3 id="carpenter">Carpenter</h3>
    <button class="book" onclick="book('Carpenter')">Book Now</button>
</div>

<div class="service">
    <span>❄️</span>
    <h3 id="AC">AC Technician</h3>
    <button class="book" onclick="book('AC Technician')">Book Now</button>
</div>

</div>
</div>

<footer>
    <p>© 2026 Worker Booking App</p>
</footer>

<script>

let urdu = false;

function changeLanguage() {
    urdu = !urdu;

    document.getElementById("langBtn").innerText =
        urdu ? "English" : "اردو";

    document.getElementById("subtitle").innerText =
        urdu ? "اپنے کام کے لیے بہترین کاریگر تلاش کریں" :
        "Find the right worker for your work";

    document.getElementById("welcome").innerText =
        urdu ? "خوش آمدید!" : "Welcome!";

    document.getElementById("description").innerText =
        urdu ? "اپنے قریب قابل اعتماد کاریگر بک کریں۔" :
        "Book trusted workers near you.";

    document.getElementById("servicesTitle").innerText =
        urdu ? "اپنی سروس منتخب کریں" : "Choose a Service";

    document.getElementById("electrician").innerText =
        urdu ? "الیکٹریشن" : "Electrician";

    document.getElementById("plumber").innerText =
        urdu ? "پلمبر" : "Plumber";

    document.getElementById("painter").innerText =
        urdu ? "پینٹر" : "Painter";

    document.getElementById("cleaner").innerText =
        urdu ? "صفائی والا" : "Cleaner";

    document.getElementById("carpenter").innerText =
        urdu ? "بڑھئی" : "Carpenter";

    document.getElementById("AC").innerText =
        urdu ? "اے سی ٹیکنیشن" : "AC Technician";

    document.querySelectorAll(".book").forEach(button => {
        button.innerText = urdu ? "ابھی بک کریں" : "Book Now";
    });
}

function book(service) {
    alert(
        (urdu ? "آپ نے منتخب کیا: " : "You selected: ") + service
    );
}

</script>

</body>
</html>
