<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookings</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:15px}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:15px}
input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#0f766e;color:white;border:0;border-radius:7px}
.card{background:#f1f5f9;padding:14px;margin:12px 0;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<h2>Worker Booking</h2>
<h3>Book a Worker</h3>

<form id="bookingForm">
<input id="workerEmail" type="email" placeholder="Worker Email" required>
<select id="service" required>
<option value="">Select Service</option>
<option>Electrician</option>
<option>Plumber</option>
<option>Painter</option>
<option>Cleaner</option>
<option>Carpenter</option>
<option>AC Technician</option>
</select>
<input id="date" type="date" required>
<input id="address" placeholder="Your Address" required>
<button>Book Now</button>
</form>

<p id="message"></p>
<h3>My Bookings</h3>
<div id="list">Loading...</div>
<button onclick="location.href='dashboard.html'">Dashboard</button>
</div>

<script type="module">
import {auth,db} from "./firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {
collection,addDoc,getDocs,query,where,doc,updateDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const form=document.getElementById("bookingForm");
const msg=document.getElementById("message");
const list=document.getElementById("list");
let user=null,role="";

onAuthStateChanged(auth,async u=>{
 if(!u){location.href="login.html";return;}
 user=u;
 try{
  const {getDoc}=await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js");
  const snap=await getDoc(doc(db,"users",u.uid));
  role=snap.exists()?snap.data().role:"";
  if(role==="worker")form.style.display="none";
  loadBookings();
 }catch(e){msg.textContent=e.message;}
});

form.addEventListener("submit",async e=>{
 e.preventDefault();
 try{
  const email=document.getElementById("workerEmail").value.trim().toLowerCase();
  const result=await getDocs(query(collection(db,"users"),
   where("email","==",email),where("role","==","worker")));

  if(result.empty){msg.textContent="Worker not found";return;}

  await addDoc(collection(db,"bookings"),{
   customerId:user.uid,
   workerId:result.docs[0].id,
   customerEmail:user.email,
   workerEmail:email,
   service:document.getElementById("service").value,
   date:document.getElementById("date").value,
   address:document.getElementById("address").value.trim(),
   status:"Pending",
   createdAt:serverTimestamp()
  });

  msg.textContent="Booking sent!";
  form.reset();
  loadBookings();
 }catch(e){msg.textContent=e.message;}
});

async function loadBookings(){
 try{
  const field=role==="worker"?"workerId":"customerId";
  const q=query(collection(db,"bookings"),where(field,"==",user.uid));
  const result=await getDocs(q);
  list.innerHTML="";

  if(result.empty){list.textContent="No bookings yet.";return;}

  result.forEach(item=>{
   const b=item.data();
   const card=document.createElement("div");
   card.className="card";

   const info=document.createElement("p");
   info.textContent=`${b.service} | ${b.date} | ${b.status} | ${role==="worker"?"Customer":"Worker"}: ${role==="worker"?b.customerEmail:b.workerEmail}`;
   card.appendChild(info);

   if(role==="worker" && b.status==="Pending"){
    ["Accepted","Rejected"].forEach(status=>{
     const btn=document.createElement("button");
     btn.textContent=status;
     btn.onclick=async()=>{
      try{
       await updateDoc(doc(db,"bookings",item.id),{status});
       loadBookings();
      }catch(e){msg.textContent=e.message;}
     };
     card.appendChild(btn);
    });
   }
   list.appendChild(card);
  });
 }catch(e){list.textContent=e.message;}
}
</script>
</body>
</html>
