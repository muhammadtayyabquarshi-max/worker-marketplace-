<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings</title>
<link rel="stylesheet" href="app.css">
</head>

<body>

<header></header>

<main>

<section class="card">

<h1>Bookings / بکنگ</h1>

<div id="formArea"></div>

<h2>Your Bookings</h2>

<div id="list">Loading...</div>

<p id="msg"></p>

</section>

</main>

<script type="module">

import { db } from "./firebase.js";

import {
  setHeader,
  requireUser
} from "./common.js";

import {
  collection,
  addDoc,
  getDocs,
  query,
  where,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const $ = id => document.getElementById(id);

setHeader();

const { user, profile } = await requireUser();

const workerId =
  new URLSearchParams(location.search).get("worker");

if(workerId) {

  const workerSnap = await getDoc(
    doc(db, "users", workerId)
  );

  if(workerSnap.exists()) {

    const worker = workerSnap.data();

    $("formArea").innerHTML = `

      <form id="bookingForm">

        <h3>Booking with: ${worker.name || "Worker"}</h3>

        <label>Service</label>
        <input id="service" required value="${worker.service || ""}">

        <label>Date</label>
        <input id="date" type="date" required>

        <label>Address</label>
        <textarea id="address" required></textarea>

        <button>Send Booking Request</button>

      </form>

    `;

    $("bookingForm").onsubmit = async e => {

      e.preventDefault();

      try {

        await addDoc(
          collection(db, "bookings"),
          {
            customerId: user.uid,
            customerName: profile.name || user.email,
            workerId: workerId,
            workerName: worker.name || "",
            service: $("service").value,
            date: $("date").value,
            address: $("address").value,
            status: "Pending",
            createdAt: serverTimestamp()
          }
        );

        $("msg").textContent = "Booking request sent!";

        $("bookingForm").reset();

        loadBookings();

      } catch(error) {

        $("msg").textContent = error.message;

      }

    };

  }

}

async function loadBookings() {

  try {

    const field =
      profile.role === "worker"
      ? "workerId"
      : "customerId";

    const result = await getDocs(
      query(
        collection(db, "bookings"),
        where(field, "==", user.uid)
      )
    );

    if(result.empty) {

      $("list").textContent = "No bookings yet.";

      return;

    }

    $("list").innerHTML = result.docs.map(d => {

      const booking = d.data();

      return `

        <div class="item">

          <h3>${booking.service}</h3>

          <p>Date: ${booking.date}</p>

          <p>Address: ${booking.address}</p>

          <p>Status: ${booking.status}</p>

          ${
            profile.role === "worker" &&
            booking.status === "Pending"

            ? `
              <button data-id="${d.id}" data-status="Accepted">
                Accept
              </button>

              <button class="secondary"
                data-id="${d.id}" data-status="Rejected">
                Reject
              </button>
            `

            : ""
          }

        </div>

      `;

    }).join("");

    document.querySelectorAll("[data-id]").forEach(button => {

      button.onclick = async () => {

        await updateDoc(
          doc(db, "bookings", button.dataset.id),
          {
            status: button.dataset.status
          }
        );

        loadBookings();

      };

    });

  } catch(error) {

    $("msg").textContent = error.message;

  }

}

loadBookings();

</script>

</body>
</html>
