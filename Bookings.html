<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings</title>
<style>
body{font-family:Arial;background:#f2f5f8;margin:0}
header{background:#075e54;color:white;padding:20px;text-align:center}
.card{background:white;padding:18px;margin:15px;border-radius:12px}
button{background:#075e54;color:white;padding:12px;border:0;border-radius:8px;margin:5px}
</style>
</head>
<body>

<header>
<h2>My Bookings</h2>
</header>

<div id="results"></div>

<script>

let user=JSON.parse(localStorage.getItem("currentUser"));

if(!user){
location.href="login.html";
}

let bookings=JSON.parse(localStorage.getItem("bookings")||"[]");

let myBookings=bookings.filter(b=>
user.type==="Customer"
? b.customer===user.phone
: b.worker===user.phone
);

let results=document.getElementById("results");

if(myBookings.length===0){
results.innerHTML="<p style='text-align:center'>No bookings yet.</p>";
}

myBookings.forEach((booking,index)=>{

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<h3>${booking.service}</h3>
<p>Worker: ${booking.workerName}</p>
<p>Status: ${booking.status}</p>
<p>Date: ${booking.date}</p>
`;

if(user.type==="Worker" && booking.status==="Pending"){

let accept=document.createElement("button");
accept.textContent="Accept";
accept.onclick=()=>updateBooking(booking,"Accepted");

let reject=document.createElement("button");
reject.textContent="Reject";
reject.onclick=()=>updateBooking(booking,"Rejected");

card.append(accept,reject);
}

results.appendChild(card);

});

function updateBooking(booking,status){

let all=JSON.parse(localStorage.getItem("bookings")||"[]");

let item=all.find(b=>
b.customer===booking.customer &&
b.worker===booking.worker &&
b.date===booking.date
);

if(item){
item.status=status;
localStorage.setItem("bookings",JSON.stringify(all));
location.reload();
}

}

</script>
</body>
</html>
