<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker Bookings</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:15px}
.box{background:white;padding:20px;border-radius:12px;max-width:450px;margin:auto}
input,select,button{width:100%;padding:12px;margin:9px 0;box-sizing:border-box}
button{background:#0f766e;color:white;border:0;border-radius:7px}
.booking{background:#f1f5f9;padding:12px;margin:12px 0;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h2>Worker Booking</h2>
<h3>Book a Worker</h3>

<form id="bookingForm">
<input id="workerEmail" type="email" placeholder="Worker Email" required>

<select id="service" required>
<option value="">Select Service</option>
<option>Electrician</option>
<option>Plumber</option>
<option>Painter</option>
<option>Cleaner</option>
<option>Carpenter</option>
<option>AC Technician</option>
</select>

<input id="date" type="date" required>
<input id="address" placeholder="Your Address" required>
<button type="submit">Book Now</button>
</form>

<p id="message"></p>
<h3>My Bookings</h3>
<div id="list">Loading...</div>
<button onclick="location.href='dashboard.html'">Dashboard</button>
</div>

<script type="module">
import {auth,db} from "./firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {
collection,addDoc,getDocs,query,where,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

let currentUser=null;
const form=document.getElementById("bookingForm");
const message=document.getElementById("message");
const list=document.getElementById("list");

onAuthStateChanged(auth,async user=>{
 if(!user){location.href="login.html";return;}
 currentUser=user;
 loadBookings();
});

form.addEventListener("submit",async e=>{
 e.preventDefault();
 if(!currentUser)return;

 message.textContent="Please wait...";

 try{
  const email=document.getElementById("workerEmail").value.trim().toLowerCase();
  const workers=await getDocs(query(
   collection(db,"users"),
   where("email","==",email),
   where("role","==","worker")
  ));

  if(workers.empty){
   message.textContent="Worker not found. Check the email.";
   return;
  }

  const worker=workers.docs[0];

  await addDoc(collection(db,"bookings"),{
   customerId:currentUser.uid,
   customerEmail:currentUser.email,
   workerId:worker.id,
   workerEmail:email,
   service:document.getElementById("service").value,
   date:document.getElementById("date").value,
   address:document.getElementById("address").value.trim(),
   status:"Pending",
   createdAt:serverTimestamp()
  });

  message.textContent="Booking sent successfully!";
  form.reset();
  loadBookings();

 }catch(error){
  message.textContent=error.message;
 }
});

async function loadBookings(){
 try{
  const q=query(collection(db,"bookings"),
   where("customerId","==",currentUser.uid));
  const result=await getDocs(q);

  list.innerHTML="";
  if(result.empty){list.textContent="No bookings yet.";return;}

  result.forEach(item=>{
   const b=item.data();
   const card=document.createElement("div");
   card.className="booking";
   card.textContent=`${b.service} | ${b.date} | ${b.status} | Worker: ${b.workerEmail}`;
   list.appendChild(card);
  });
 }catch(error){
  list.textContent=error.message;
 }
}
</script>
</body>
</html>
