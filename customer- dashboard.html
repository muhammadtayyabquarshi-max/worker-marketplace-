<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:20px}
.box{max-width:600px;margin:auto}
h2{color:#087f5b;text-align:center}
a,button{display:block;width:100%;box-sizing:border-box;padding:15px;margin:10px 0;border:0;border-radius:9px;background:#087f5b;color:white;text-decoration:none;text-align:center;font-size:16px}
button{background:#d93025}
</style>
</head>
<body>
<div class="box">
<h2>Customer Dashboard</h2>
<p id="welcome">Loading...</p>

<a href="workers.html">👷 Find Workers</a>
<a href="bookings.html">📋 My Bookings</a>
<a href="notifications.html">🔔 Notifications</a>
<a href="reviews.html">⭐ My Reviews</a>
<a href="payment.html">💳 Payment Options</a>
<a href="profile.html">👤 My Profile</a>
<a href="support.html">🆘 Help & Support</a>
<a href="more.html">☰ More Options</a>

<button id="logout">Logout</button>
</div>

<script type="module">
import {auth,db} from "./firebase.js";
import {onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {doc,getDoc}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

onAuthStateChanged(auth,async user=>{
 if(!user){location.href="login.html";return;}
 const snap=await getDoc(doc(db,"users",user.uid));
 if(!snap.exists()){location.href="register.html";return;}
 const data=snap.data();
 if(data.role!=="customer"){location.href="dashboard.html";return;}
 document.getElementById("welcome").textContent=
 "Welcome, "+(data.name||user.email);
});

document.getElementById("logout").onclick=async()=>{
 await signOut(auth);
 location.href="login.html";
};
</script>
</body>
</html>
