<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<link rel="stylesheet" href="app.css">

<style>
body {
  font-family: Arial;
  background: #f2f5f7;
  padding: 15px;
}
.container {
  max-width: 850px;
  margin: auto;
}
.card {
  background: white;
  padding: 18px;
  margin: 15px 0;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
button {
  padding: 10px 16px;
  background: #087f5b;
  color: white;
  border: 0;
  border-radius: 7px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td, th {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}
.table-wrap {
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="container">

<h2>Admin Dashboard / ایڈمن پینل</h2>

<p id="message">Loading...</p>

<div id="panel" style="display:none">

<div class="card">
<h3>Statistics / اعدادوشمار</h3>
<p>Total Users: <b id="usersCount">0</b></p>
<p>Total Workers: <b id="workersCount">0</b></p>
<p>Total Customers: <b id="customersCount">0</b></p>
<p>Total Bookings: <b id="bookingsCount">0</b></p>
<p>Pending Bookings: <b id="pendingCount">0</b></p>
</div>

<div class="card">
<h3>Users / صارفین</h3>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>City</th>
</tr>
</thead>
<tbody id="usersList"></tbody>
</table>
</div>
</div>

<div class="card">
<h3>All Bookings / تمام بکنگز</h3>
<div id="bookingsList"></div>
</div>

<button id="refreshBtn">Refresh Data</button>

</div>
</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const message = document.getElementById("message");
const panel = document.getElementById("panel");

let allowed = false;

onAuthStateChanged(auth, async user => {

  if (!user) {
    message.textContent = "Please login first.";
    return;
  }

  try {

    const snap = await getDoc(doc(db, "users", user.uid));

    if (!snap.exists() || snap.data().role !== "admin") {
      message.textContent = "Access denied. Admin only.";
      return;
    }

    allowed = true;
    panel.style.display = "block";

    await loadData();

  } catch(error) {
    message.textContent = error.message;
  }

});

async function loadData() {

  if (!allowed) return;

  message.textContent = "Loading data...";

  try {

    const userSnap = await getDocs(collection(db, "users"));
    const bookingSnap = await getDocs(collection(db, "bookings"));

    let workers = 0;
    let customers = 0;
    let pending = 0;

    const usersList = document.getElementById("usersList");
    const bookingsList = document.getElementById("bookingsList");

    usersList.innerHTML = "";
    bookingsList.innerHTML = "";

    userSnap.forEach(item => {

      const u = item.data();

      if (u.role === "worker") workers++;
      if (u.role === "customer") customers++;

      const tr = document.createElement("tr");

      [u.name, u.email, u.role, u.city].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value || "";
        tr.appendChild(td);
      });

      usersList.appendChild(tr);

    });

    bookingSnap.forEach(item => {

      const b = item.data();

      if (b.status === "pending") pending++;

      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h4");
      title.textContent = b.service || "Booking";

      const details = document.createElement("p");
      details.textContent =
        "Customer: " + (b.customerName || "") +
        " | Worker: " + (b.workerName || "") +
        " | Date: " + (b.date || "") +
        " | Status: " + (b.status || "");

      card.append(title, details);
      bookingsList.appendChild(card);

    });

    document.getElementById("usersCount").textContent = userSnap.size;
    document.getElementById("workersCount").textContent = workers;
    document.getElementById("customersCount").textContent = customers;
    document.getElementById("bookingsCount").textContent = bookingSnap.size;
    document.getElementById("pendingCount").textContent = pending;

    message.textContent = "Admin data loaded.";

  } catch(error) {

    message.textContent =
      "Could not load data: " + error.message;

  }

}

document.getElementById("refreshBtn")
.addEventListener("click", loadData);

</script>

</body>
</html>
