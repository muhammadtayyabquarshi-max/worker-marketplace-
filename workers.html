<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Workers</title>

<style>
body {
  font-family: Arial;
  background: #f1f5f9;
  padding: 15px;
}
h2 { text-align: center; color: #0f766e; }
.worker {
  background: white;
  padding: 18px;
  margin: 12px 0;
  border-radius: 12px;
}
button {
  background: #0f766e;
  color: white;
  padding: 12px;
  border: 0;
  border-radius: 7px;
}
</style>
</head>

<body>

<h2>Available Workers</h2>

<input id="search" placeholder="Search workers..."
style="width:100%;padding:12px;box-sizing:border-box">

<div id="workers">Loading workers...</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const container = document.getElementById("workers");
const search = document.getElementById("search");

let workerList = [];

async function loadWorkers() {
  try {
    const q = query(
      collection(db, "users"),
      where("role", "==", "worker")
    );

    const result = await getDocs(q);

    workerList = result.docs.map(d => d.data());

    showWorkers(workerList);

  } catch (error) {
    container.textContent = "Error: " + error.message;
  }
}

function showWorkers(list) {
  container.innerHTML = "";

  if (list.length === 0) {
    container.textContent = "No workers registered yet.";
    return;
  }

  list.forEach(worker => {
    const card = document.createElement("div");
    card.className = "worker";

    const name = document.createElement("h3");
    name.textContent = worker.name || "Worker";

    const phone = document.createElement("p");
    phone.textContent = "Phone: " + (worker.phone || "Not added");

    const email = document.createElement("p");
    email.textContent = "Email: " + (worker.email || "");

    card.append(name, phone, email);
    container.appendChild(card);
  });
}

search.addEventListener("input", () => {
  const value = search.value.toLowerCase();

  showWorkers(workerList.filter(w =>
    (w.name || "").toLowerCase().includes(value)
  ));
});

loadWorkers();

</script>
</body>
</html>
