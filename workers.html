<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Workers</title>
<link rel="stylesheet" href="app.css">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f9;
}
main {
  max-width: 600px;
  margin: 20px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
}
input {
  width: 100%;
  padding: 13px;
  box-sizing: border-box;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
}
.item {
  background: #f1f5f9;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
}
.btn {
  display: inline-block;
  padding: 11px 18px;
  background: #087f5b;
  color: white;
  text-decoration: none;
  border-radius: 7px;
}
#msg {
  color: red;
}
</style>
</head>

<body>

<header></header>

<main>
<section class="card">

<h1>Find Workers / کاریگر تلاش کریں</h1>

<input
id="search"
type="text"
placeholder="Search service or city / کام یا شہر تلاش کریں">

<div id="list">Loading workers...</div>

<p id="msg"></p>

</section>
</main>

<script type="module">

import { db } from "./firebase.js";

import {
  setHeader,
  requireUser
} from "./common.js";

import {
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const $ = id => document.getElementById(id);

setHeader();

await requireUser();

let workers = [];

try {

  const result = await getDocs(
    query(
      collection(db, "users"),
      where("role", "==", "worker")
    )
  );

  workers = result.docs.map(d => ({
    id: d.id,
    ...d.data()
  }));

  showWorkers();

} catch(error) {

  $("list").textContent = "Could not load workers.";
  $("msg").textContent = error.message;

}

function showWorkers() {

  const term = $("search").value.toLowerCase();

  const filtered = workers.filter(worker => {

    const text =
      `${worker.name || ""} ${worker.service || ""} ${worker.city || ""}`;

    return text.toLowerCase().includes(term);

  });

  $("list").innerHTML = filtered.length

    ? filtered.map(worker => `

      <div class="item">

        <h3>${worker.name || "Worker"}</h3>

        <p>Service: ${worker.service || "Not added"}</p>

        <p>City: ${worker.city || "Not added"}</p>

        <a class="btn"
        href="bookings.html?worker=${encodeURIComponent(worker.id)}">
        Request Booking
        </a>

      </div>

    `).join("")

    : "No workers found.";

}

$("search").oninput = showWorkers;

</script>

</body>
</html>
