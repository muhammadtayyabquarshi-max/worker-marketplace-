<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Booking - Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0002;
    }

    h2 {
      text-align: center;
      color: #0f766e;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background: #0f766e;
      color: white;
      border: none;
      cursor: pointer;
    }

    .language {
      background: #334155;
    }

    p {
      text-align: center;
    }

    a {
      color: #0f766e;
    }

    #message {
      color: #dc2626;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">

  <button class="language" onclick="changeLanguage()">
    اردو / English
  </button>

  <h2 id="title">Worker Booking Login</h2>

  <form id="loginForm">

    <input
      type="email"
      id="email"
      placeholder="Email Address"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <p>
    <a href="#" id="forgot">Forgot Password?</a>
  </p>

  <p id="message"></p>

  <p>
    <span id="accountText">Don't have an account?</span>
    <a href="register.html" id="registerLink">Register</a>
  </p>

</div>

<script type="module">

  import { auth } from "./firebase.js";

  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.style.color = "red";
    message.textContent = "Please wait...";

    try {

      const result = await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      localStorage.setItem("currentUser", JSON.stringify({
        uid: result.user.uid,
        email: result.user.email
      }));

      message.style.color = "green";
      message.textContent = "Login successful!";

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);

    } catch(error) {

      message.textContent = error.message;

    }

  });

  document.getElementById("forgot").addEventListener("click", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
      message.textContent = "Enter your email first.";
      return;
    }

    try {
      await sendPasswordResetEmail(auth, email);
      message.style.color = "green";
      message.textContent = "Password reset email sent!";
    } catch(error) {
      message.textContent = error.message;
    }

  });

  let urdu = false;

  window.changeLanguage = function() {

    urdu = !urdu;

    document.getElementById("title").textContent =
      urdu ? "ورکر بکنگ لاگ اِن" : "Worker Booking Login";

    document.getElementById("email").placeholder =
      urdu ? "ای میل ایڈریس" : "Email Address";

    document.getElementById("password").placeholder =
      urdu ? "پاس ورڈ" : "Password";

    document.getElementById("loginBtn").textContent =
      urdu ? "لاگ اِن کریں" : "Login";

    document.getElementById("forgot").textContent =
      urdu ? "پاس ورڈ بھول گئے؟" : "Forgot Password?";

    document.getElementById("accountText").textContent =
      urdu ? "اکاؤنٹ نہیں ہے؟" : "Don't have an account?";

    document.getElementById("registerLink").textContent =
      urdu ? "رجسٹر کریں" : "Register";
  };

</script>

</body>
</html>
