<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Worker Booking</title>
<link rel="stylesheet" href="app.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f1f5f9;
padding:20px;
}
.card{
max-width:420px;
margin:40px auto;
background:white;
padding:25px;
border-radius:15px;
}
input,button{
width:100%;
box-sizing:border-box;
padding:14px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}
button{
background:#087f5b;
color:white;
border:none;
font-weight:bold;
}
#msg{color:#d93025}
a{color:#087f5b}
</style>
</head>

<body>

<div class="card">

<h2>Login / لاگ اِن</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit" id="loginBtn">
Login / لاگ اِن
</button>

</form>

<p id="msg"></p>

<p>
Forgot Password?
<a href="forgot-password.html">Reset Password</a>
</p>

<p>
New User?
<a href="register.html">Create Account</a>
</p>

<a href="index.html">Back to Home</a>

</div>

<script type="module">

import {auth,db} from "./firebase.js";

import {
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
doc,getDoc
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const form=document.getElementById("loginForm");
const msg=document.getElementById("msg");
const btn=document.getElementById("loginBtn");

form.addEventListener("submit",async function(e){

e.preventDefault();

msg.textContent="Please wait...";
btn.disabled=true;

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{

const result=await signInWithEmailAndPassword(
auth,email,password
);

const user=result.user;

const profileSnap=await getDoc(
doc(db,"users",user.uid)
);

if(!profileSnap.exists()){

msg.textContent="Profile not found. Please register again.";
btn.disabled=false;
return;

}

const profile=profileSnap.data();

if(profile.role==="customer"){

window.location.href="customer-dashboard.html";

}

else if(profile.role==="worker"){

window.location.href="worker-dashboard.html";

}

else{

msg.textContent="Account role is not valid. Contact admin.";
btn.disabled=false;

}

}catch(error){

if(error.code==="auth/invalid-credential"){
msg.textContent="Incorrect email or password.";
}
else if(error.code==="auth/user-not-found"){
msg.textContent="Account not found. Please register.";
}
else if(error.code==="auth/too-many-requests"){
msg.textContent="Too many attempts. Try again later.";
}
else{
msg.textContent=error.message;
}

btn.disabled=false;

}

});

</script>

</body>
</html>
