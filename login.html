<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Worker Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    padding: 20px;
}

.container {
    max-width: 400px;
    margin: 50px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 2px 10px #ddd;
}

h2 {
    text-align: center;
    color: #075e54;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    background: #075e54;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 15px;
}

p {
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h2>Worker Booking</h2>

<h3>Login to Your Account</h3>

<form id="loginForm">

<input
type="tel"
id="phone"
placeholder="Mobile Number"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">Login</button>

</form>

<p id="message"></p>

<p>Don't have an account?</p>

<p>
<a href="register.html">Create New Account</a>
</p>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(e) {

e.preventDefault();

document.getElementById("message").innerText =
"Login system will be connected to the database soon.";

});

</script>

</body>
</html>
