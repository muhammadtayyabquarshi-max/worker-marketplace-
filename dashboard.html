<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="app.css">
</head>
<a href="more.html" style="
display:block;
background:#087f5b;
color:white;
padding:15px;
margin:15px;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
">
☰ More Options
</a>

<body>

<header></header>

<main>

<section class="card">

<h1>Dashboard / ڈیش بورڈ</h1>

<p id="welcome">Loading...</p>

<div class="grid">

<a class="btn" href="workers.html">Find Workers</a>

<a class="btn" href="bookings.html">My Bookings</a>

<a class="btn" href="profile.html">Edit Profile</a>

<a class="btn" href="index.html">Home</a>

</div>

<p id="msg"></p>

</section>

</main>

<script type="module">

import {
  setHeader,
  requireUser
} from "./common.js";

const $ = id => document.getElementById(id);

setHeader();

try {

  const { user, profile } = await requireUser();

  $("welcome").textContent =
    "Welcome " + (profile.name || user.email) +
    " | Role: " + (profile.role || "customer");

} catch(error) {

  $("msg").textContent = error.message;

}

</script>

</body>
</html>
