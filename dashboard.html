<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker Booking Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #f1f5f9;
  padding: 20px;
  text-align: center;
}
.box {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
}
button {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  background: #0f766e;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}
#logout {
  background: #dc2626;
}
</style>
</head>

<body>

<div class="box">
<h2>Worker Booking</h2>
<h3 id="welcome">Loading...</h3>
<p id="role"></p>

<div id="actions" hidden>
  <button onclick="location.href='workers.html'">Find Workers</button>
  <button onclick="location.href='bookings.html'">My Bookings</button>
  <button onclick="location.href='profile.html'">My Profile</button>
  <button id="logout">Logout</button>
</div>

<p id="message"></p>
</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  doc, getDoc
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const welcome = document.getElementById("welcome");
const roleText = document.getElementById("role");
const actions = document.getElementById("actions");
const message = document.getElementById("message");

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {
      message.textContent = "User profile not found.";
      return;
    }

    const data = userSnap.data();

    welcome.textContent = "Welcome, " + data.name;
    roleText.textContent = "Account Type: " + data.role;

    actions.hidden = false;

  } catch (error) {
    message.textContent = error.message;
  }

});

document.getElementById("logout").addEventListener("click", async () => {
  await signOut(auth);
  localStorage.removeItem("currentUser");
  location.href = "login.html";
});

</script>

</body>
</html>
